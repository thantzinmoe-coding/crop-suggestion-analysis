[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenvista-api"
version = "0.1.0"
description = "FastAPI backend for the GreenVista agricultural intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "joblib>=1.4,<2.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pymongo>=4.9,<5.0",
    "pydantic-settings>=2.7,<3.0",
    "openpyxl>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "email-validator>=2.2,<3.0",
    "truststore>=0.10,<1.0",
    "scikit-learn>=1.7,<1.8",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
vision = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=9.0.0",
]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
